# SentinelAI -- docker-compose.yml
# Provides MongoDB for persistent event storage.
#
# Usage:
#   docker compose up -d          (start MongoDB in background)
#   docker compose down           (stop and remove containers)
#   docker compose down -v        (also remove data volume)

services:
  mongo:
    image: mongo:7
    container_name: sentinelai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: sentinelai
    restart: unless-stopped

volumes:
  mongo_data:
